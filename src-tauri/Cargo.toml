[package]
name = "fantasy-piano-house"
version = "1.1.0"
description = "奇幻钢琴屋 - 儿童键盘钢琴 (桌面版)"
authors = ["huijiangyuan"]
edition = "2021"
default-run = "fantasy-piano-house"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 直接复用 rdev 0.5.3 同版本的 CoreGraphics / Cocoa 裸绑定，
# 自行实现 HID 级 CGEventTap（kCGHIDEventTap），理由：
#   - rdev 的 grab 一旦被系统临时禁用（kCGEventTapDisabledByEventTap）不会自愈，
#     导致 F1–F12 等功能键漏拦；自管 tap 可在回调里收到禁用事件后 CGEventTapEnable 重新启用。
#   - 直接在回调里读 CGEventGetFlags 判断 Cmd 组合，无需像 rdev 那样手动维护修饰键状态。
core-graphics = { version = "0.19", features = ["highsierra"] }
cocoa = "0.22"

[features]
default = []
